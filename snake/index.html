<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐍</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Snake 2 · The Lab</title>
  <link rel="stylesheet" href="snake.css">
</head>
<body>
  <header class="size top">
    <a href="../index.html">← Lab</a>
    <div class="title"><b>Snake 2</b><span id="lvl-name"></span></div>
    <span class="scores"><span class="score" id="score">0</span><span class="best" id="best"></span></span>
  </header>
  <div class="size hud">
    <span id="lives" class="lives" aria-label="Lives"></span>
    <span class="goal" title="Apples to clear the level"><span id="eaten">0/0</span><i class="gbar"><i id="gfill"></i></i></span>
    <span id="effects" class="effects" aria-label="Active power-ups"></span>
    <button id="pause-btn" class="hud-btn" aria-label="Pause">⏸</button>
  </div>
  <div class="size stage" id="stage">
    <canvas id="board" width="720" height="720" aria-label="Snake 2 board"></canvas>
    <div id="overlay" class="overlay"></div>
  </div>
  <p id="msg">Arrows or WASD, swipe on a phone. P to pause.</p>
  <div class="pad" aria-label="Direction buttons">
    <button class="up" data-d="0,-1" aria-label="Up">▲</button>
    <button class="left" data-d="-1,0" aria-label="Left">◀</button>
    <button class="down" data-d="0,1" aria-label="Down">▼</button>
    <button class="right" data-d="1,0" aria-label="Right">▶</button>
  </div>
  <script src="../kit/kit.js"></script>
  <script src="levels.js"></script>
  <script src="snake.js"></script>
</body>
</html>
